; Dethleffs Globebus control panel - Stage 1 (display + touch only)
; Target: Waveshare ESP32-S3-Touch-LCD-4.3B (ESP32-S3-WROOM-1-N16R8)
; Toolchain versions copied from the ESP32_Display_Panel official PlatformIO
; example (examples/platformio/lvgl_v8_port) - known-good combination.

[platformio]
default_envs = ws43b

[env:ws43b]
board = waveshare_esp32s3_touch_lcd_4_3b
framework = arduino

; Official PlatformIO platform does not ship Arduino-ESP32 3.x; pioarduino does.
; Pinned (not "stable") so the build does not silently change under you.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
    platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
    ; Espressif "high performance" libs: mitigates the known ESP32-S3 RGB-LCD screen-drift issue
    platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip

lib_deps =
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#92b790ed6d24b0678e2f45b1fc85f0abd2d41b33
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
    https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
    https://github.com/lvgl/lvgl.git#v8.4.0
    bblanchon/ArduinoJson@7.2.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_COLOR_16_SWAP=0
    -I src
    ; Select the library's built-in 4.3B board profile (NOT the plain 4.3)
    -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
    -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_4_3_B

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
